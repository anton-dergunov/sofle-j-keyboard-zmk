# Cornix keymap: the layout chosen in November 2026 (proposal A in README.md), written to the keyboard by apply.py.
#
# Each layer lists its rows as they look on the desk, left to right, with "|" between the halves:
#   rows 1-3: the letter block, 6 keys per half;
#   row 4:    the six bottom keys per half: three under the outer columns, then the three thumb keys
#             (left half: ⌃ ⌥ ⌘ then outer, middle, inner thumb; the right half mirrors it).
# Keycodes are QMK/Vial names, the ones Vial and vitaly accept. "_" is KC_TRNS (does what the layer below does).
# QK_KB_n are the RMK firmware's "User" keys: QK_KB_0-2 Bluetooth profiles 1-3 (the Cornix has three),
# QK_KB_5 forgets the current profile's pairing, QK_KB_6 switches the output between USB and Bluetooth.
# DESK_PERSONAL and DESK_WORK are placeholders for the desk switch, not wired yet: apply.py writes KC_NO there.
#
# Num and M1 are tap dances (`tapdances` below): hold for the layer, double-tap to lock it. On the locked
# layer the same key is TG(n), so one tap unlocks. M2 is a plain hold key.
#
# The knobs are not keys in this file: `knobs` gives what turning and pressing each knob does on that layer.
# `reach` lists the layers whose keys are held to get to this layer; the pictures draw those keys amber.

# Vial tap dances TD(0), TD(1), ...: tap, hold, double tap, tap-then-hold, and the tapping term in ms.
tapdances:
  - {name: Num, tap: KC_NO, hold: MO(3), double_tap: TG(3), tap_hold: MO(3), term_ms: 200}
  - {name: M1, tap: KC_NO, hold: MO(1), double_tap: TG(1), tap_hold: MO(1), term_ms: 200}

# Vial's Tap-Hold settings, global. Num and M1 are the only tap-hold keys and their tap does nothing, so the
# layer comes on as soon as another key is pressed (as a plain hold key would), and the firmware's chordal hold
# and flow tap, which could turn a quick Num + 1 into a tap, are off. Permissive hold is the other hold mode;
# the firmware turns it off when hold-on-other-press is turned on.
tap_hold:
  permissive_hold: false
  hold_on_other_press: true
  chordal_hold: false
  flow_tap_ms: 0

layers:
  - name: Base
    rows:
      - KC_TAB  KC_Q KC_W KC_E KC_R KC_T | KC_Y KC_U KC_I    KC_O   KC_P    KC_BSPC
      - KC_ENT  KC_A KC_S KC_D KC_F KC_G | KC_H KC_J KC_K    KC_L   KC_SCLN KC_QUOT
      - KC_LSFT KC_Z KC_X KC_C KC_V KC_B | KC_N KC_M KC_COMM KC_DOT KC_SLSH KC_RSFT
      - KC_LCTL KC_LALT KC_LGUI TD(0) TD(1) KC_SPC | KC_SPC TD(1) TD(0) KC_RGUI KC_RALT KC_RCTL
    knobs: {turn: [KC_VOLD, KC_VOLU], press: KC_MUTE}   # both knobs

  - name: Nav
    reach: [1]
    rows:
      - KC_CAPS KC_GRV _ _ _ _     | KC_PGUP KC_HOME KC_UP   KC_END  KC_MINS KC_EQL
      - _       _      _ _ _ MO(2) | KC_PGDN KC_LEFT KC_DOWN KC_RGHT KC_LBRC KC_RBRC
      - _ KC_F1 KC_F2 KC_F3 KC_F4 KC_F5 | KC_F6 KC_F7 KC_F8 KC_F9 KC_F10 _
      - _ _ _ _ TG(1) _ | _ TG(1) _ _ MO(2) _
    knobs: {turn: [_, _], press: _}

  - name: System
    reach: [1, 2]
    rows:
      - QK_KB_5 QK_KB_0 QK_KB_1 QK_KB_2 _ _ | QK_KB_0 QK_KB_1 QK_KB_2 _ _ QK_KB_5
      - _ _ _ DESK_PERSONAL DESK_WORK _ | _ _ DESK_PERSONAL DESK_WORK _ _
      - _ QK_REBOOT _ QK_KB_6 _ QK_BOOTLOADER | QK_REBOOT _ QK_KB_6 _ QK_BOOTLOADER _
      - _ _ _ _ _ _ | _ _ _ _ _ _
    knobs: {turn: [_, _], press: _}

  - name: Num
    reach: [3]
    rows:
      - KC_ESC  KC_1    KC_2    KC_3    KC_4    KC_5    | KC_6    KC_7    KC_8    KC_9    KC_0    KC_BSLS
      - _       KC_BRID KC_BRIU KC_MCTL KC_LPAD KC_WSCH | KC_MPRV KC_MPLY KC_MNXT KC_MUTE KC_VOLD KC_VOLU
      - _ _ _ _ _ _ | _ _ _ _ _ _
      - _ _ _ TG(3) _ _ | _ _ TG(3) _ _ _
    knobs: {turn: [_, _], press: _}
