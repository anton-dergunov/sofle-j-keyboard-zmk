draw_config:
  n_columns: 1
  # follow the viewer's light/dark theme (Obsidian, GitHub)
  dark_mode: auto
  draw_key_sides: false
  key_w: 60.0
  key_h: 56.0
  split_gap: 30.0
  combo_w: 28.0
  combo_h: 26.0
  key_rx: 6.0
  key_ry: 6.0
  inner_pad_w: 2.0
  inner_pad_h: 2.0
  outer_pad_w: 40.0
  outer_pad_h: 56.0
  line_spacing: 1.2
  arc_radius: 6.0
  append_colon_to_layer_header: true
  small_pad: 2.0
  svg_extra_style: |
    /* For default sytles, see https://github.com/caksoylar/keymap-drawer/blob/main/keymap_drawer/config.py#L85 */

    svg.keymap {
      font-family: Ubuntu Mono, Inconsolata, Consolas, Liberation Mono, Menlo, monospace;
      font-size: 12px;
      font-weight: bold;
      text-rendering: optimizeLegibility;
    }

    /* Keys that wipe Bluetooth pairings, and the desk-switch keys */
    rect.danger { fill: #fde2e2; stroke: #d9534f; }
    rect.desk { fill: #dff0ff; stroke: #3c8dde; }
    @media (prefers-color-scheme: dark) {
      rect.danger { fill: #5a2626; stroke: #e57373; }
      rect.desk { fill: #1f3a57; stroke: #64a8f0; }
    }

    /* Held layer keys (M1, M2) */
    rect.held, rect.combo.held { fill: #fff1a8; }
    @media (prefers-color-scheme: dark) {
      rect.held, rect.combo.held { fill: #5c5222; }
    }

    /* Transparent keys: same as the base layer, so keep them quiet */
    rect.trans { opacity: 0.45; }

    /* Technique borrowed and extended from https://github.com/englmaxi/zmk-config/blob/master/keymap-drawer/config.yaml */
    .sym_sub_text.tap {
      translate: -5px 2px;
      font-size: 20px;
    }
    .sym_sub_text.shifted {
      translate: 10px 13px;
      font-size: 10px;
      opacity: 1.0;
    }
    .combo.sym_sub_text.tap {
      translate: -1px 1px;
    }
    .combo.sym_sub_text.shifted {
      translate: 7px 5px;
      font-size: 10px;
      opacity: 1.0;
    }

    /* Toggle */
    .toggle.shifted {
      translate: -10px 12px;
    }

    .toggle.hold {
      translate: 13px -23px;
    }

    /* Variant for tap-dances */
    .tap_dance.tap {
      translate: -7px 0px;
      font-size: 12px;
    }
    .tap_dance.shifted {
      translate: 7px 17px;
      font-size: 12px;
      opacity: 1.0;
    }

    /* Variant for symbol next to symbol */
    .sym_by_sym.tap {
      translate: -6px 0px;
    }
    .sym_by_sym.shifted {
      translate: 10px 12px;
      opacity: 1.0;
    }

    .combo.sym_by_sym.tap {
      translate: -35px 0px;
    }
    .combo.sym_by_sym.shifted {
      translate: 35px 20px;
      opacity: 1.0;
    }

    .combo.sym_by_sym.hold {
      visibility: hidden;
    }

    /* hide hold box for combo sym_by_sym */
    .combo.sym_by_sym.hold > path[stroke="none"][fill="none"] {
      visibility: hidden;
    }

  shrink_wide_legends: 9
  glyph_tap_size: 18
  glyph_hold_size: 15
  glyph_shifted_size: 15
  # Icons not in Tabler, drawn in its style. keymap-drawer/draw.py reads these too.
  glyphs:
    play-pause: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6v12l8 -6z"/><path d="M15 6v12"/><path d="M20 6v12"/></svg>'
  glyph_urls:
    # pinned to the release vendored in keymap-drawer/icons/
    tabler: https://unpkg.com/@tabler/icons@3.50.0/icons/outline/{}.svg
    tablerf: https://unpkg.com/@tabler/icons@3.50.0/icons/filled/{}.svg
    mdi: https://raw.githubusercontent.com/Templarian/MaterialDesign-SVG/master/svg/{}.svg
    mdil: https://raw.githubusercontent.com/Pictogrammers/MaterialDesignLight/master/svg/{}.svg
    material: https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/{}/default/48px.svg
  use_local_cache: true

parse_config:
  # Legends: t = main, s = small one above it, h = caption below; type = colour class.
  # Icons are $$tabler:<name>$$ (https://tabler.io/icons), vendored in keymap-drawer/icons/.

  # Layer keys show as M1 / M2, the names used for them everywhere else
  layer_legend_map:
    Nav: M1
    System: M2
  mark_alternate_layer_activators: true
  # Transparent keys do what the base layer does: leave them blank
  trans_legend:
    t: ''
    type: trans

  raw_binding_map:
    # Desk switch (desk-switch app + macros in the keymap)
    "&to_personal": {t: $$tabler:device-laptop$$, h: Personal, type: desk}
    "&to_work": {t: $$tabler:device-laptop$$, h: Work, type: desk}

    # Bluetooth profiles, numbered from 1 like the keyboard's display (BT_SEL 0 is profile 1)
    "&bt BT_SEL 0": {t: '1', s: $$tabler:bluetooth$$}
    "&bt BT_SEL 1": {t: '2', s: $$tabler:bluetooth$$, h: personal}
    "&bt BT_SEL 2": {t: '3', s: $$tabler:bluetooth$$, h: work}
    "&bt BT_SEL 3": {t: '4', s: $$tabler:bluetooth$$}
    "&bt BT_SEL 4": {t: '5', s: $$tabler:bluetooth$$}
    "&bt BT_DISC 0": {t: '1', s: $$tabler:unlink$$, type: muted}
    "&bt BT_DISC 1": {t: '2', s: $$tabler:unlink$$, type: muted}
    "&bt BT_DISC 2": {t: '3', s: $$tabler:unlink$$, type: muted}
    "&bt BT_DISC 3": {t: '4', s: $$tabler:unlink$$, type: muted}
    "&bt BT_DISC 4": {t: '5', s: $$tabler:unlink$$, type: muted}
    "&bt BT_CLR": {t: $$tabler:trash$$, h: clear, type: danger}
    "&bt BT_CLR_ALL": {t: $$tabler:trash$$, h: clear all, type: danger}
    "&bt BT_NXT": {t: $$tabler:bluetooth$$, h: next}
    "&bt BT_PRV": {t: $$tabler:bluetooth$$, h: previous}

    # Output and power
    "&out OUT_USB": {t: $$tabler:usb$$, h: USB out}
    "&out OUT_BLE": {t: $$tabler:bluetooth$$, h: BT out}
    "&out OUT_TOG": {t: $$tabler:usb$$, h: USB/BT}
    "&soft_off": {t: $$tabler:power$$, h: 'off'}
    "&sys_reset": {t: $$tabler:refresh$$, h: reset}
    "&bootloader": {t: $$tabler:download$$, h: flash}

    # Mouse (on the joystick, which the pictures leave out)
    "&mmv MOVE_UP": {t: $$tabler:arrow-up$$, h: mouse}
    "&mmv MOVE_DOWN": {t: $$tabler:arrow-down$$, h: mouse}
    "&mmv MOVE_LEFT": {t: $$tabler:arrow-left$$, h: mouse}
    "&mmv MOVE_RIGHT": {t: $$tabler:arrow-right$$, h: mouse}
    "&mkp LCLK": {t: click}

    "&none": {t: '', type: none}
    "&caps_word": {t: "caps\nword"}

  zmk_keycode_map:
    # Numbers with their shifted symbols
    N1: {t: '1', s: '!'}
    N2: {t: '2', s: '@'}
    N3: {t: '3', s: '#'}
    N4: {t: '4', s: $}
    N5: {t: '5', s: '%'}
    N6: {t: '6', s: ^}
    N7: {t: '7', s: '&'}
    N8: {t: '8', s: '*'}
    N9: {t: '9', s: (}
    N0: {t: '0', s: )}

    # Punctuation with their shifted symbols
    MINUS: {t: '-', s: _}
    EQUAL: {t: '=', s: +}
    LEFT_BRACKET: {t: '[', s: '{'}
    LBKT: {t: '[', s: '{'}
    RIGHT_BRACKET: {t: ']', s: '}'}
    RBKT: {t: ']', s: '}'}
    BACKSLASH: {t: \, s: '|'}
    BSLH: {t: \, s: '|'}
    SEMICOLON: {t: ;, s: ':'}
    SEMI: {t: ;, s: ':'}
    APOSTROPHE: {t: "'", s: '"'}
    APOS: {t: "'", s: '"'}
    SQT: {t: "'", s: '"'}
    GRAVE: {t: '`', s: '~'}
    COMMA: {t: ',', s: <}
    DOT: {t: ., s: '>'}
    PERIOD: {t: ., s: '>'}
    SLASH: {t: /, s: '?'}
    FSLH: {t: /, s: '?'}

    # Modifiers and editing keys, with the symbols Apple keyboards use
    LCTRL: ⌃
    LEFT_CONTROL: ⌃
    RCTRL: ⌃
    RCTL: ⌃
    RIGHT_CONTROL: ⌃
    LALT: ⌥
    LEFT_ALT: ⌥
    RALT: ⌥
    RIGHT_ALT: ⌥
    LGUI: ⌘
    LEFT_GUI: ⌘
    LCMD: ⌘
    RGUI: ⌘
    RIGHT_GUI: ⌘
    RCMD: ⌘
    LSHFT: ⇧
    LSHIFT: ⇧
    LEFT_SHIFT: ⇧
    RSHFT: ⇧
    RSHIFT: ⇧
    RIGHT_SHIFT: ⇧
    CAPS: ⇪
    CAPSLOCK: ⇪
    ESC: esc
    ESCAPE: esc
    TAB: ⇥
    ENTER: ↩
    RET: ↩
    BACKSPACE: ⌫
    BSPC: ⌫
    DELETE: ⌦
    DEL: ⌦
    SPACE: $$tabler:space$$

    # Navigation
    UP: $$tabler:arrow-up$$
    UP_ARROW: $$tabler:arrow-up$$
    DOWN: $$tabler:arrow-down$$
    DOWN_ARROW: $$tabler:arrow-down$$
    LEFT: $$tabler:arrow-left$$
    LEFT_ARROW: $$tabler:arrow-left$$
    RIGHT: $$tabler:arrow-right$$
    RIGHT_ARROW: $$tabler:arrow-right$$
    PG_UP: "page\nup"
    PAGE_UP: "page\nup"
    PG_DN: "page\ndown"
    PAGE_DOWN: "page\ndown"
    HOME: home
    END: end

    # Media and volume, as on the Mac's function row
    C_PREV: $$tabler:player-track-prev$$
    C_PP: $$play-pause$$
    C_NEXT: $$tabler:player-track-next$$
    C_MUTE: $$tabler:volume-3$$
    C_VOL_DN: $$tabler:volume-2$$
    C_VOLUME_DOWN: $$tabler:volume-2$$
    C_VOL_UP: $$tabler:volume$$
    C_VOLUME_UP: $$tabler:volume$$

    # macOS system keys, as on the Mac's function row
    C_BRI_DN: $$tabler:brightness-down$$
    C_BRI_UP: $$tabler:brightness-up$$
    C_AC_DESKTOP_SHOW_ALL_WINDOWS: $$tabler:app-window$$
    C_AC_DESKTOP_SHOW_ALL_APPLICATIONS: $$tabler:layout-grid$$
    C_AC_SEARCH: $$tabler:search$$

  zmk_combos:
    # Q + S + Z held 2 s turns the keyboard off; the note says so, the pictures don't
    softoff:
      hidden: true
