draw_config:
  n_columns: 1
  # follow the viewer's light/dark theme (Obsidian, GitHub)
  dark_mode: auto
  draw_key_sides: false
  key_w: 60.0
  key_h: 56.0
  split_gap: 30.0
  combo_w: 28.0
  combo_h: 26.0
  key_rx: 6.0
  key_ry: 6.0
  inner_pad_w: 2.0
  inner_pad_h: 2.0
  outer_pad_w: 40.0
  outer_pad_h: 56.0
  line_spacing: 1.2
  arc_radius: 6.0
  append_colon_to_layer_header: true
  small_pad: 2.0
  svg_extra_style: |
    /* For default sytles, see https://github.com/caksoylar/keymap-drawer/blob/main/keymap_drawer/config.py#L85 */

    svg.keymap {
      font-family: Ubuntu Mono, Inconsolata, Consolas, Liberation Mono, Menlo, monospace;
      font-size: 12px;
      font-weight: bold;
      text-rendering: optimizeLegibility;
    }

    /* Keys that wipe Bluetooth pairings, and the desk-switch keys */
    rect.danger { fill: #fde2e2; stroke: #d9534f; }
    rect.desk { fill: #dff0ff; stroke: #3c8dde; }
    @media (prefers-color-scheme: dark) {
      rect.danger { fill: #5a2626; stroke: #e57373; }
      rect.desk { fill: #1f3a57; stroke: #64a8f0; }
    }

    /* Held layer keys (M1, M2) */
    rect.held, rect.combo.held { fill: #fff1a8; }
    @media (prefers-color-scheme: dark) {
      rect.held, rect.combo.held { fill: #5c5222; }
    }

    /* Transparent keys: same as the base layer, so keep them quiet */
    rect.trans { opacity: 0.45; }

    /* Technique borrowed and extended from https://github.com/englmaxi/zmk-config/blob/master/keymap-drawer/config.yaml */
    .sym_sub_text.tap {
      translate: -5px 2px;
      font-size: 20px;
    }
    .sym_sub_text.shifted {
      translate: 10px 13px;
      font-size: 10px;
      opacity: 1.0;
    }
    .combo.sym_sub_text.tap {
      translate: -1px 1px;
    }
    .combo.sym_sub_text.shifted {
      translate: 7px 5px;
      font-size: 10px;
      opacity: 1.0;
    }

    /* Toggle */
    .toggle.shifted {
      translate: -10px 12px;
    }

    .toggle.hold {
      translate: 13px -23px;
    }

    /* Variant for tap-dances */
    .tap_dance.tap {
      translate: -7px 0px;
      font-size: 12px;
    }
    .tap_dance.shifted {
      translate: 7px 17px;
      font-size: 12px;
      opacity: 1.0;
    }

    /* Variant for symbol next to symbol */
    .sym_by_sym.tap {
      translate: -6px 0px;
    }
    .sym_by_sym.shifted {
      translate: 10px 12px;
      opacity: 1.0;
    }

    .combo.sym_by_sym.tap {
      translate: -35px 0px;
    }
    .combo.sym_by_sym.shifted {
      translate: 35px 20px;
      opacity: 1.0;
    }

    .combo.sym_by_sym.hold {
      visibility: hidden;
    }

    /* hide hold box for combo sym_by_sym */
    .combo.sym_by_sym.hold > path[stroke="none"][fill="none"] {
      visibility: hidden;
    }

  shrink_wide_legends: 9
  glyph_tap_size: 18
  glyph_hold_size: 15
  glyph_shifted_size: 15
  glyphs: {}
  glyph_urls:
    tabler: https://unpkg.com/@tabler/icons/icons/outline/{}.svg
    tablerf: https://unpkg.com/@tabler/icons/icons/filled/{}.svg
    mdi: https://raw.githubusercontent.com/Templarian/MaterialDesign-SVG/master/svg/{}.svg
    mdil: https://raw.githubusercontent.com/Pictogrammers/MaterialDesignLight/master/svg/{}.svg
    material: https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/{}/default/48px.svg
  use_local_cache: true

parse_config:
  # Layer keys show as M1 / M2, the names used for them everywhere else
  layer_legend_map:
    Nav: M1
    System: M2
  mark_alternate_layer_activators: true
  # Transparent keys do what the base layer does: leave them blank
  trans_legend:
    t: ''
    type: trans

  raw_binding_map:
    # Desk switch (desk-switch app + macros in the keymap)
    "&to_personal":
      t: Personal
      s: $$mdi:laptop$$
      h: desk
      type: desk
    "&to_work":
      t: Work
      s: $$mdi:laptop$$
      h: desk
      type: desk

    # Bluetooth profiles, numbered like ZMK counts them (BT_SEL 0..4)
    "&bt BT_SEL 0": {t: "BT  0", s: $$mdi:bluetooth-connect$$}
    "&bt BT_SEL 1": {t: "BT  1", s: $$mdi:bluetooth-connect$$, h: personal}
    "&bt BT_SEL 2": {t: "BT  2", s: $$mdi:bluetooth-connect$$, h: work}
    "&bt BT_SEL 3": {t: "BT  3", s: $$mdi:bluetooth-connect$$}
    "&bt BT_SEL 4": {t: "BT  4", s: $$mdi:bluetooth-connect$$}
    "&bt BT_DISC 0": {t: "BT  0", s: $$mdi:link-variant-off$$, h: "off"}
    "&bt BT_DISC 1": {t: "BT  1", s: $$mdi:link-variant-off$$, h: "off"}
    "&bt BT_DISC 2": {t: "BT  2", s: $$mdi:link-variant-off$$, h: "off"}
    "&bt BT_DISC 3": {t: "BT  3", s: $$mdi:link-variant-off$$, h: "off"}
    "&bt BT_DISC 4": {t: "BT  4", s: $$mdi:link-variant-off$$, h: "off"}
    "&bt BT_CLR":
      t: "Clear\nBT"
      h: profile
      type: danger
    "&bt BT_CLR_ALL":
      t: "Clear\nall BT"
      type: danger
    "&bt BT_NXT": {t: "BT  next", s: $$mdi:bluetooth-connect$$}
    "&bt BT_PRV": {t: "BT  prev", s: $$mdi:bluetooth-connect$$}

    # Output and power
    "&out OUT_USB": {t: USB, s: $$mdi:usb$$, h: output}
    "&out OUT_BLE": {t: BLE, s: $$mdi:bluetooth$$, h: output}
    "&out OUT_TOG": {t: USB/BLE, h: output}
    "&soft_off": {t: "Off", s: $$mdi:power$$, h: hold 2 s}
    "&sys_reset": {t: Reset, s: $$mdi:restart$$}
    "&bootloader": {t: "Boot-\nloader", s: $$mdi:download$$}

    # Mouse
    "&mmv MOVE_UP": {t: $$mdi:arrow-up-thin$$, s: $$mdi:mouse$$}
    "&mmv MOVE_DOWN": {t: $$mdi:arrow-down-thin$$, s: $$mdi:mouse$$}
    "&mmv MOVE_LEFT": {t: $$mdi:arrow-left-thin$$, s: $$mdi:mouse$$}
    "&mmv MOVE_RIGHT": {t: $$mdi:arrow-right-thin$$, s: $$mdi:mouse$$}
    "&mkp LCLK": {t: $$mdi:mouse-left-click-outline$$, h: click}
    "&mkp RCLK": {t: $$mdi:mouse-right-click-outline$$, h: right}
    "&mkp MCLK": {t: $$mdi:mouse-scroll-wheel$$, h: middle}
    "&msc SCRL_UP": {t: $$mdi:pan-up$$, h: scroll}
    "&msc SCRL_DOWN": {t: $$mdi:pan-down$$, h: scroll}

    "&none": {t: '', type: none}
    "&caps_word": {t: Caps word}

  zmk_keycode_map:
    # Numbers with their shifted symbols
    N1: {t: '1', s: '!'}
    N2: {t: '2', s: '@'}
    N3: {t: '3', s: '#'}
    N4: {t: '4', s: $}
    N5: {t: '5', s: '%'}
    N6: {t: '6', s: ^}
    N7: {t: '7', s: '&'}
    N8: {t: '8', s: '*'}
    N9: {t: '9', s: (}
    N0: {t: '0', s: )}

    # Punctuation with their shifted symbols
    MINUS: {t: '-', s: _}
    EQUAL: {t: '=', s: +}
    LEFT_BRACKET: {t: '[', s: '{'}
    LBKT: {t: '[', s: '{'}
    RIGHT_BRACKET: {t: ']', s: '}'}
    RBKT: {t: ']', s: '}'}
    BACKSLASH: {t: \, s: '|'}
    BSLH: {t: \, s: '|'}
    SEMICOLON: {t: ;, s: ':'}
    SEMI: {t: ;, s: ':'}
    APOSTROPHE: {t: "'", s: '"'}
    APOS: {t: "'", s: '"'}
    SQT: {t: "'", s: '"'}
    GRAVE: {t: '`', s: '~'}
    COMMA: {t: ',', s: <}
    DOT: {t: ., s: '>'}
    PERIOD: {t: ., s: '>'}
    SLASH: {t: /, s: '?'}
    FSLH: {t: /, s: '?'}

    # Modifiers, as macOS labels them
    LCTRL: $$mdi:apple-keyboard-control$$
    LEFT_CONTROL: $$mdi:apple-keyboard-control$$
    RCTRL: $$mdi:apple-keyboard-control$$
    RCTL: $$mdi:apple-keyboard-control$$
    RIGHT_CONTROL: $$mdi:apple-keyboard-control$$
    LALT: $$mdi:apple-keyboard-option$$
    LEFT_ALT: $$mdi:apple-keyboard-option$$
    RALT: $$mdi:apple-keyboard-option$$
    RIGHT_ALT: $$mdi:apple-keyboard-option$$
    LGUI: $$mdi:apple-keyboard-command$$
    LEFT_GUI: $$mdi:apple-keyboard-command$$
    LCMD: $$mdi:apple-keyboard-command$$
    RGUI: $$mdi:apple-keyboard-command$$
    RIGHT_GUI: $$mdi:apple-keyboard-command$$
    RCMD: $$mdi:apple-keyboard-command$$
    LSHFT: $$mdi:apple-keyboard-shift$$
    LSHIFT: $$mdi:apple-keyboard-shift$$
    LEFT_SHIFT: $$mdi:apple-keyboard-shift$$
    RSHFT: $$mdi:apple-keyboard-shift$$
    RSHIFT: $$mdi:apple-keyboard-shift$$
    RIGHT_SHIFT: $$mdi:apple-keyboard-shift$$
    CAPS: $$mdi:apple-keyboard-caps$$
    CAPSLOCK: $$mdi:apple-keyboard-caps$$

    # Whitespace and editing
    ESC: $$mdi:keyboard-esc$$
    ESCAPE: $$mdi:keyboard-esc$$
    TAB: $$mdi:keyboard-tab$$
    SPACE: $$mdi:keyboard-space$$
    ENTER: $$mdi:keyboard-return$$
    RET: $$mdi:keyboard-return$$
    BACKSPACE: $$mdi:backspace-outline$$
    BSPC: $$mdi:backspace-outline$$
    DELETE: $$mdi:backspace-reverse-outline$$
    DEL: $$mdi:backspace-reverse-outline$$

    # Navigation
    UP: $$mdi:arrow-up-bold$$
    UP_ARROW: $$mdi:arrow-up-bold$$
    DOWN: $$mdi:arrow-down-bold$$
    DOWN_ARROW: $$mdi:arrow-down-bold$$
    LEFT: $$mdi:arrow-left-bold$$
    LEFT_ARROW: $$mdi:arrow-left-bold$$
    RIGHT: $$mdi:arrow-right-bold$$
    RIGHT_ARROW: $$mdi:arrow-right-bold$$
    PG_UP: "Page\nup"
    PAGE_UP: "Page\nup"
    PG_DN: "Page\ndown"
    PAGE_DOWN: "Page\ndown"
    HOME: Home
    END: End

    # Sound and media
    C_MUTE: $$mdi:volume-off$$
    C_VOL_UP: $$mdi:volume-plus$$
    C_VOLUME_UP: $$mdi:volume-plus$$
    C_VOL_DN: $$mdi:volume-minus$$
    C_VOLUME_DOWN: $$mdi:volume-minus$$
    C_PREV: $$mdi:skip-previous$$
    C_PP: $$mdi:play-pause$$
    C_NEXT: $$mdi:skip-next$$

    # macOS system keys
    C_BRI_DN: {t: $$mdi:brightness-5$$, h: dimmer}
    C_BRI_UP: {t: $$mdi:brightness-7$$, h: brighter}
    C_AC_DESKTOP_SHOW_ALL_WINDOWS: "Mission\ncontrol"
    C_AC_DESKTOP_SHOW_ALL_APPLICATIONS: "Launch-\npad"
    C_AC_SEARCH: "Spot-\nlight"

  zmk_combos:
    # Q + S + Z held 2 s turns the keyboard off; draw it on the base layer only
    softoff:
      l: [Base]
      k: $$mdi:power$$
